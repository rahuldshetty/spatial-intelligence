[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-intelligence"
version = "0.0.1"
description = "Spatial Intelligence: a geospatial-analysis agent in a custom web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv",
  # pydantic-ai already depends on pydantic-ai-slim[openai,anthropic,google,...],
  # which is what installs the provider SDKs; the [openai,anthropic,google-gla]
  # extras named here before do not exist and only produced install warnings.
  "pydantic-ai",
  "pydantic-ai-harness>=0.24.0",
  "rasterio",
  "rioxarray",
  "geopandas",
  "pyogrio",
  "shapely",
  "pyproj",
  # Image processing: the sandbox exposes these to run_python, and the contour
  # tool is built on skimage.measure. scipy arrives with skimage and is listed
  # because generated snippets use it directly.
  "scikit-image",
  "scipy",
  # COG creation and validation for run_python, like the two above it: the app
  # imports it at startup to expose it to generated code. It is deliberately not
  # what decides whether the map can load a raster (that check is structural,
  # rasterio-only, in geo.raster.looks_cog).
  "rio-cogeo",
  "numpy",
  "pandas",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "geolibre==2.9.0",
  # Local AI models (segment_image, detect_objects). A main dependency, not an
  # extra: it is 14 MB, ships wheels everywhere, and backs tools the UI presents
  # as built in — an install that cannot segment is a broken install.
  # `onnxruntime-gpu` provides the same import where CUDA is wanted; install one
  # or the other, never both.
  "onnxruntime>=1.20",
]

# The `gdal` package (the `osgeo` bindings) is deliberately absent: it publishes no
# wheels on any platform, so installing it means compiling against a GDAL C library
# that is not present — and nothing here uses it. GDAL itself ships inside rasterio
# (3.10.3), which is what `gdal_translate` drives.

[project.urls]
Homepage = "https://github.com/spatialint-org/spatial-intelligence"
Repository = "https://github.com/spatialint-org/spatial-intelligence"
Issues = "https://github.com/spatialint-org/spatial-intelligence/issues"

[project.optional-dependencies]
# Heavy research libraries for the run_python sandbox, which `skill()` documents.
# One extra, deliberately: torch alone is a 124 MB wheel (and far more installed),
# and a CUDA machine needs torch from the CUDA index rather than the CPU wheel a
# plain dependency would pin — so this stays something the user opts into, with
# the index they actually want. `pip install -e ".[geoai]"` takes the CPU wheel.
# terratorch's torchgeo pin forces the version split: 1.2.12+ demands
# torchgeo>=0.9, and torchgeo 0.9 is Python 3.12+, so 3.11 stays on the last
# unpinned terratorch.
geoai = [
  "torch>=2.2",
  "terratorch>=1.2,<1.2.12; python_version < '3.12'",
  "terratorch>=1.2.12; python_version >= '3.12'",
  "torchgeo>=0.8,<0.9; python_version < '3.12'",
  "torchgeo>=0.10; python_version >= '3.12'",
  "torchvision",
  "timm",
  "huggingface_hub",
]

[project.scripts]
spatial-intelligence = "spatial_intelligence.server:run"

[tool.setuptools.packages.find]
include = ["spatial_intelligence*"]

[tool.setuptools.package-data]
spatial_intelligence = ["web/**/*", "skills/**/*"]
