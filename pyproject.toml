[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-intelligence"
version = "0.0.1"
description = "Spatial Intelligence: a geospatial-analysis agent in a custom web UI"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv",
  # pydantic-ai already depends on pydantic-ai-slim[openai,anthropic,google,...],
  # which is what installs the provider SDKs; the [openai,anthropic,google-gla]
  # extras named here before do not exist and only produced install warnings.
  "pydantic-ai",
  "pydantic-ai-harness>=0.24.0",
  "rasterio",
  "rioxarray",
  "geopandas",
  "pyogrio",
  "shapely",
  "pyproj",
  # Image processing: the sandbox exposes these to run_python, and the contour
  # tool is built on skimage.measure. scipy arrives with skimage and is listed
  # because generated snippets use it directly.
  "scikit-image",
  "scipy",
  # COG creation and validation for run_python, like the two above it: the app
  # imports it at startup to expose it to generated code. It is deliberately not
  # what decides whether the map can load a raster (that check is structural,
  # rasterio-only, in geo.raster.looks_cog).
  "rio-cogeo",
  "numpy",
  "pandas",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "geolibre==2.9.0",
]

# The `gdal` package (the `osgeo` bindings) is deliberately absent: it publishes no
# wheels on any platform, so installing it means compiling against a GDAL C library
# that is not present — and nothing here uses it. GDAL itself ships inside rasterio
# (3.10.3), which is what `gdal_translate` drives.

[project.scripts]
spatial-intelligence = "spatial_intelligence.server:run"

[tool.setuptools.packages.find]
include = ["spatial_intelligence*"]

[tool.setuptools.package-data]
spatial_intelligence = ["web/**/*"]
